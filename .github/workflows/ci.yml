name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: pnpm lint

    - name: Build all packages
      run: pnpm build

    - name: Build provider
      run: pnpm build:provider

    - name: Check provider size
      run: pnpm --filter @nostrpass/provider check-size

    - name: Install Playwright
      run: npx playwright install --with-deps

    - name: Start dev servers
      run: |
        pnpm dev &
        sleep 30
      env:
        CI: true

    - name: Run E2E tests
      run: pnpm test:e2e
      timeout-minutes: 10

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
