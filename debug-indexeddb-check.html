<!DOCTYPE html>
<html>
<head>
  <title>IndexedDB Debug Tool - NostrPass</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #00ff00;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #00ff00; }
    .section {
      background: #0a0a0a;
      border: 1px solid #00ff00;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
    }
    pre {
      background: #000;
      padding: 10px;
      overflow-x: auto;
      border-left: 3px solid #00ff00;
    }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background: #00cc00;
    }
    .error { color: #ff0000; }
    .success { color: #00ff00; }
    .warning { color: #ffaa00; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 NostrPass IndexedDB Debug Tool</h1>

    <div class="section">
      <h2>Check Stored Vault Data</h2>
      <button onclick="checkVaultData()">Check Vault Data</button>
      <button onclick="listAllDatabases()">List All Databases</button>
      <button onclick="clearAllData()">⚠️ Clear All Local Data</button>
      <div id="output"></div>
    </div>
  </div>

  <script>
    function log(message, type = 'info') {
      const output = document.getElementById('output');
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
      output.innerHTML += `<pre class="${className}">${message}</pre>`;
    }

    async function listAllDatabases() {
      log('📊 Listing all IndexedDB databases...', 'info');
      try {
        const databases = await indexedDB.databases();
        log(`Found ${databases.length} database(s):`, 'success');
        databases.forEach((db, i) => {
          log(`${i + 1}. ${db.name} (version: ${db.version})`);
        });
      } catch (error) {
        log(`Error listing databases: ${error.message}`, 'error');
      }
    }

    async function checkVaultData() {
      document.getElementById('output').innerHTML = '';
      log('🔍 Starting IndexedDB inspection...', 'info');

      const dbNames = ['nostrpass-vault', 'nostrpass-crypto', 'nostrpass'];

      for (const dbName of dbNames) {
        log(`\n${'='.repeat(60)}`, 'info');
        log(`📦 Checking database: ${dbName}`, 'info');
        log('='.repeat(60), 'info');

        try {
          const db = await openDatabase(dbName);
          const objectStoreNames = Array.from(db.objectStoreNames);

          log(`✅ Database found with ${objectStoreNames.length} object store(s):`, 'success');
          log(`   Stores: ${objectStoreNames.join(', ')}`);

          for (const storeName of objectStoreNames) {
            log(`\n  📁 Object Store: ${storeName}`, 'info');

            try {
              const data = await getAllFromStore(db, storeName);
              log(`     Records: ${data.length}`);

              if (data.length > 0) {
                data.forEach((item, i) => {
                  log(`\n     Record #${i + 1}:`);

                  // Special handling for vault data
                  if (storeName.includes('vault') || storeName.includes('user')) {
                    const sanitized = {...item};
                    if (sanitized.xprivEncrypted) {
                      sanitized.xprivEncrypted = `[ENCRYPTED ${sanitized.xprivEncrypted.length} chars]`;
                    }
                    if (sanitized.privateKey) {
                      sanitized.privateKey = '[REDACTED]';
                    }
                    if (sanitized.passwordSalt) {
                      sanitized.passwordSalt = `[${sanitized.passwordSalt.substring(0, 20)}...]`;
                    }
                    log(JSON.stringify(sanitized, null, 2));
                  } else {
                    log(JSON.stringify(item, null, 2));
                  }
                });
              } else {
                log('     (empty)', 'warning');
              }
            } catch (error) {
              log(`     ⚠️ Error reading store: ${error.message}`, 'error');
            }
          }

          db.close();
        } catch (error) {
          log(`❌ Database "${dbName}" not found or error: ${error.message}`, 'warning');
        }
      }

      // Check localStorage
      log(`\n${'='.repeat(60)}`, 'info');
      log('💾 Checking localStorage...', 'info');
      log('='.repeat(60), 'info');

      const localStorageKeys = Object.keys(localStorage).filter(k => k.includes('nostrpass') || k.includes('vault'));
      if (localStorageKeys.length > 0) {
        log(`Found ${localStorageKeys.length} relevant key(s):`, 'success');
        localStorageKeys.forEach(key => {
          const value = localStorage.getItem(key);
          log(`\n  🔑 ${key}:`);
          try {
            const parsed = JSON.parse(value);
            const sanitized = {...parsed};
            if (sanitized.privateKey) sanitized.privateKey = '[REDACTED]';
            if (sanitized.xprivEncrypted) sanitized.xprivEncrypted = `[ENCRYPTED ${sanitized.xprivEncrypted.length} chars]`;
            log(JSON.stringify(sanitized, null, 2));
          } catch {
            log(`  ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}`);
          }
        });
      } else {
        log('No nostrpass-related keys found', 'warning');
      }

      log('\n✅ Inspection complete!', 'success');
    }

    function openDatabase(name) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(name);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onupgradeneeded = () => {
          // Don't create anything, just open
        };
      });
    }

    function getAllFromStore(db, storeName) {
      return new Promise((resolve, reject) => {
        try {
          const transaction = db.transaction([storeName], 'readonly');
          const store = transaction.objectStore(storeName);
          const request = store.getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        } catch (error) {
          resolve([]);
        }
      });
    }

    async function clearAllData() {
      if (!confirm('⚠️ This will DELETE all local vault data. Are you sure?')) {
        return;
      }

      document.getElementById('output').innerHTML = '';
      log('🗑️ Clearing all local data...', 'warning');

      // Clear IndexedDB
      const databases = await indexedDB.databases();
      for (const db of databases) {
        if (db.name.includes('nostrpass') || db.name.includes('vault')) {
          log(`Deleting database: ${db.name}`);
          await new Promise((resolve, reject) => {
            const request = indexedDB.deleteDatabase(db.name);
            request.onsuccess = resolve;
            request.onerror = reject;
          });
        }
      }

      // Clear localStorage
      const keys = Object.keys(localStorage).filter(k => k.includes('nostrpass') || k.includes('vault'));
      keys.forEach(key => {
        log(`Removing localStorage key: ${key}`);
        localStorage.removeItem(key);
      });

      // Clear sessionStorage
      const sessionKeys = Object.keys(sessionStorage).filter(k => k.includes('nostrpass') || k.includes('vault'));
      sessionKeys.forEach(key => {
        log(`Removing sessionStorage key: ${key}`);
        sessionStorage.removeItem(key);
      });

      log('\n✅ All data cleared! Reload the page.', 'success');
    }
  </script>
</body>
</html>
