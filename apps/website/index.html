<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>NostrPass - Authentication for the Modern Decentralized Web</title>
    <meta name="description" content="Drop-in authentication for Nostr apps. Add secure, privacy-first auth to your application in minutes, not days. Built by developers, for developers." />
    <meta name="keywords" content="nostr, authentication, decentralized, web3, privacy, security, developers, auth" />
    <meta name="author" content="" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="NostrPass - Authentication for the Modern Decentralized Web" />
    <meta property="og:description" content="Drop-in authentication for Nostr apps. Add secure, privacy-first auth to your application in minutes, not days." />
    <meta property="og:image" content="https://nostrpass.com/social-preview.png" />
    <meta property="og:url" content="https://nostrpass.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NostrPass" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NostrPass - Authentication for the Modern Decentralized Web" />
    <meta name="twitter:description" content="Drop-in authentication for Nostr apps. Add secure, privacy-first auth to your application in minutes, not days." />
    <meta name="twitter:image" content="https://nostrpass.com/social-preview.png" />
    
    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nostrpass.com" />
    <script src="https://cdn.nostrpass.com/embassy.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (typeof window.initNostrPass !== 'function') {
          console.warn('[NostrPass Demo] Embassy script not ready; skipping NostrPass button demo.');
          return;
        }

        const provider = window.initNostrPass({
          appName: 'NostrPass Test Site',
          appDomain: window.location.origin,
          vaultUrl: 'https://vault.nostrpass.com/',
          // storageEnvironment: 'demo' // Uncomment to save accounts to 'demo' namespace for testing
        });

        // Create container for NostrPass button
        const demoContainer = document.createElement('div');
        demoContainer.id = 'nostrpass-button-demo';
        demoContainer.style.position = 'fixed';
        demoContainer.style.top = '24px';
        demoContainer.style.right = '24px';
        demoContainer.style.zIndex = '2147483647';
        demoContainer.style.display = 'flex';
        demoContainer.style.alignItems = 'center';
        demoContainer.style.gap = '12px';

        // Add badge
        const badge = document.createElement('div');
        badge.textContent = 'NostrPass Demo';
        badge.style.background = 'rgba(15, 23, 42, 0.85)';
        badge.style.color = 'white';
        badge.style.padding = '8px 16px';
        badge.style.borderRadius = '9999px';
        badge.style.fontSize = '12px';
        badge.style.fontWeight = '600';
        badge.style.boxShadow = '0 10px 30px rgba(15, 23, 42, 0.35)';

        demoContainer.appendChild(badge);
        document.body.appendChild(demoContainer);

        // Create the NostrPass button
        try {
          const nostrpassButton = provider.createNostrPassButton({
            appendTo: demoContainer,
            theme: 'auto',
            showNpub: true,
            showManageAccount: true,
            onSignIn: (user) => {
              console.log('[NostrPass Demo] User signed in:', user);
              // Update badge to show signed in state
              badge.textContent = `Signed in as ${user.nickname || 'Identity ' + (user.identityIndex + 1)}`;
              badge.style.background = 'rgba(16, 185, 129, 0.85)'; // Green
            },
            onSignOut: () => {
              console.log('[NostrPass Demo] User signed out');
              // Reset badge
              badge.textContent = 'NostrPass Demo';
              badge.style.background = 'rgba(15, 23, 42, 0.85)';
            },
            onError: (error) => {
              console.error('[NostrPass Demo] Error:', error);
            }
          });

          // Try to restore session
          nostrpassButton.restoreSession().then(restored => {
            if (restored) {
              const user = nostrpassButton.getUser();
              if (user) {
                badge.textContent = `Signed in as ${user.nickname || 'Identity ' + (user.identityIndex + 1)}`;
                badge.style.background = 'rgba(16, 185, 129, 0.85)';
              }
            }
          });
        } catch (error) {
          console.error('[NostrPass Demo] Failed to create button:', error);
        }
      });
    </script>
  </body>
</html>
