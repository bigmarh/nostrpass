[package]
name = "nostrpass-crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Cryptography - Using k256 for WASM compatibility
k256 = { version = "0.13", features = ["arithmetic", "schnorr", "ecdsa", "ecdh"] }
# For BIP32 derivation - using pure Rust implementation
bip32 = { version = "0.4", default-features = false, features = ["alloc", "secp256k1"] }
bip39 = "2.0"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = "0.12"
bs58 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = { version = "0.8", features = ["getrandom"] }

# For Nostr operations
bitcoin_hashes = "0.13"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "WorkerGlobalScope",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true