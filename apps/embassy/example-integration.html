<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NostrPass Integration Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .auth-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .auth-section h2 {
            margin-top: 0;
            font-size: 16px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1>NostrPass Embassy Integration Example</h1>

    <div class="auth-section">
        <h2>Authentication</h2>
        <div id="nostrpass-button"></div>
    </div>

    <div id="status">Loading NostrPass...</div>

    <button id="get-pubkey" disabled>Get Public Key</button>
    <button id="sign-event" disabled>Sign Event</button>
    <div style="margin-top:12px">
      <input id="sign-data-input" placeholder="Message to sign" style="width:340px"/>
      <button id="sign-data" disabled>Sign Data</button>
    </div>
    <div style="margin-top:12px">
      <input id="nip04-pubkey" placeholder="Peer pubkey (hex)" style="width:340px"/>
      <input id="nip04-plaintext" placeholder="Plaintext" style="width:340px"/>
      <button id="nip04-encrypt" disabled>Encrypt</button>
    </div>
    <div style="margin-top:12px">
      <input id="nip04-sender" placeholder="Sender pubkey (hex)" style="width:340px"/>
      <input id="nip04-cipher" placeholder="Ciphertext" style="width:340px"/>
      <button id="nip04-decrypt" disabled>Decrypt</button>
    </div>
    <button id="show-vault">Show Vault</button>
    <button id="hide-vault">Hide Vault</button>
    
    <div id="result"></div>

    <!-- Include the Embassy SDK with config via data attributes -->
    <script src="./dist/embassy.iife.js" 
            data-vault-url="http://localhost:3001"
            data-app-name="NostrPass Test App"
            data-debug="true"></script>
    
    <script>
        // The script auto-initializes window.nostr
        console.log('Embassy script loaded, window.nostr:', window.nostr);
        console.log('Available functions:', {
            showVault: typeof window.showVault,
            hideVault: typeof window.hideVault
        });
        
        // Wait for Embassy to be ready
        window.addEventListener('nostr:ready', () => {
            console.log('nostr:ready event fired!');
            document.getElementById('status').textContent = 'NostrPass Ready!';
            document.getElementById('get-pubkey').disabled = false;
            document.getElementById('sign-event').disabled = false;
            document.getElementById('sign-data').disabled = false;
            document.getElementById('nip04-encrypt').disabled = false;
            document.getElementById('nip04-decrypt').disabled = false;
        });
        
        // Also check if window.nostr is available immediately
        setTimeout(() => {
            console.log('After timeout - window.nostr:', window.nostr);
            if (window.nostr) {
                document.getElementById('status').textContent = 'NostrPass Available (no ready event)';
                document.getElementById('get-pubkey').disabled = false;
                document.getElementById('sign-event').disabled = false;
                document.getElementById('sign-data').disabled = false;
                document.getElementById('nip04-encrypt').disabled = false;
                document.getElementById('nip04-decrypt').disabled = false;

                // Create the new NostrPass button
                if (window.nostr.createNostrPassButton) {
                    const button = window.nostr.createNostrPassButton({
                        appendTo: '#nostrpass-button',
                        signInText: 'Login with NostrPass',
                        onSignIn: (user) => {
                            console.log('User signed in:', user);
                            document.getElementById('status').textContent = 'Signed in as: ' + (user.nickname || user.publicKey.slice(0, 8) + '...');
                        },
                        onSignOut: () => {
                            console.log('User signed out');
                            document.getElementById('status').textContent = 'Signed out';
                        }
                    });

                    // Try to restore previous session
                    button.restoreSession();
                }
            }
        }, 1000);

        // Get Public Key
        document.getElementById('get-pubkey').addEventListener('click', async () => {
            try {
                const pubkey = await window.nostr.getPublicKey();
                document.getElementById('result').textContent = 'Public Key: ' + pubkey;
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        });

        // Sign Event
        document.getElementById('sign-event').addEventListener('click', async () => {
            try {
                const event = {
                    kind: 1,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [],
                    content: "Hello from NostrPass test!"
                };
                
                const signedEvent = await window.nostr.signEvent(event);
                document.getElementById('result').textContent = 'Signed Event: ' + JSON.stringify(signedEvent, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        });

        // Show/Hide Vault UI
        // Sign Data
        document.getElementById('sign-data').addEventListener('click', async () => {
            try {
                const msg = (document.getElementById('sign-data-input') as HTMLInputElement).value || 'hello';
                const sig = await (window as any).nostr?.signData?.(msg) || await (window as any).nostr?.nip04?.encrypt?.('', msg); // fallback in case signData is routed elsewhere
                document.getElementById('result').textContent = 'Signature: ' + JSON.stringify(sig);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + (error as any).message;
            }
        });

        // NIP-04 Encrypt
        document.getElementById('nip04-encrypt').addEventListener('click', async () => {
            try {
                const pubkey = (document.getElementById('nip04-pubkey') as HTMLInputElement).value;
                const plaintext = (document.getElementById('nip04-plaintext') as HTMLInputElement).value || 'hello';
                const ct = await (window as any).nostr?.nip04?.encrypt(pubkey, plaintext);
                document.getElementById('result').textContent = 'Ciphertext: ' + ct;
                (document.getElementById('nip04-cipher') as HTMLInputElement).value = ct;
                (document.getElementById('nip04-sender') as HTMLInputElement).value = pubkey;
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + (error as any).message;
            }
        });

        // NIP-04 Decrypt
        document.getElementById('nip04-decrypt').addEventListener('click', async () => {
            try {
                const sender = (document.getElementById('nip04-sender') as HTMLInputElement).value;
                const cipher = (document.getElementById('nip04-cipher') as HTMLInputElement).value;
                const pt = await (window as any).nostr?.nip04?.decrypt(sender, cipher);
                document.getElementById('result').textContent = 'Plaintext: ' + pt;
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + (error as any).message;
            }
        });
        document.getElementById('show-vault').addEventListener('click', () => {
            window.showVault?.();
        });

        document.getElementById('hide-vault').addEventListener('click', () => {
            window.hideVault?.();
        });
    </script>
</body>
</html>
